name: 每日更新團購

on:
  schedule:
    - cron: "10 */2 * * *"  # 每 2 小時一次；每次讀最久沒更新的約 100 個帳號（Meta 每小時上限）
  workflow_dispatch:          # 也可以在 Actions 頁面手動按「Run workflow」
    inputs:
      build_only:
        description: "只重新產生網頁（不讀 IG、不跑 AI）"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false
# 每次執行最多 90 分鐘就收工，留給下一次

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow

      - name: 讀取 IG 貼文
        if: ${{ !inputs.build_only }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
        run: python scripts/fetch.py

      - name: AI 整理團購資訊
        if: ${{ !inputs.build_only }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/parse.py

      - name: 從貼文的 @提及 擴充帳號名單
        run: python scripts/grow.py

      - name: 產生網頁
        run: python scripts/build.py

      - name: 追蹤商品開團通知
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/notify.py

      - name: 保存資料
        run: |
          git config user.name "catchon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/; git add accounts_auto.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "更新團購資料 $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          git pull --rebase -q origin main && git push

      - name: 檢查有沒有讀到帳號
        run: python -c "import json,sys; s=json.load(open('data/last_run.json')); print(s); lim=all('code\":4' in e['error'] or 'limit' in e['error'] for e in s['errors']); sys.exit(0 if s['ok']>0 or lim else 1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
