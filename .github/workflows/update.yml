name: 每日更新團購

on:
  schedule:
    - cron: "0 21 * * *"    # 每天 06:00 韓國時間
    - cron: "40 1 * * *"    # 每天 10:40 韓國時間（抓 10 點開團的）
  workflow_dispatch: {}      # 也可以在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow

      - name: 讀取 IG 貼文
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
        run: python scripts/fetch.py

      - name: AI 整理團購資訊
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/parse.py

      - name: 產生網頁
        run: python scripts/build.py

      - name: 保存資料
        run: |
          git config user.name "catchon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posts.json data/last_run.json
          git diff --cached --quiet || git commit -m "更新團購資料 $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          git push

      - name: 檢查有沒有讀到帳號
        run: python -c "import json,sys; s=json.load(open('data/last_run.json')); print(s); sys.exit(0 if s['ok']>0 else 1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
