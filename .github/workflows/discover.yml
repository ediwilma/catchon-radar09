name: 從 09pangpang 找帳號（手動）

on:
  workflow_dispatch:
    inputs:
      count:
        description: "要讀幾篇 09pangpang 貼文頁"
        default: "4000"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/discover_09pangpang.py 0 ${{ inputs.count }}
      - name: 保存結果
        run: |
          git config user.name "catchon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/discovered_09pangpang.json
          git diff --cached --quiet || git commit -m "09pangpang 帳號清單"
          git pull --rebase -q origin main && git push
